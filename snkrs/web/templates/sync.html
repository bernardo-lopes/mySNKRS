<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="darkreader-lock">
    <title>SNKRS • StockX Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background-color: #0B0C10; color: #E5E7EB; font-family: ui-sans-serif, system-ui, sans-serif; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-[#15171E] border border-[#262A35] rounded-2xl p-6 space-y-3">
        <div class="text-xs uppercase tracking-wider text-gray-500">StockX Sync</div>
        <div id="status" class="text-lg font-semibold text-white">Waiting for StockX…</div>
        <div id="detail" class="text-sm text-gray-400">Click the SNKRS bookmark on a StockX product page.</div>
        <a id="openLink" href="/" class="hidden inline-block mt-2 text-sm px-4 py-2 rounded-lg bg-white text-black font-semibold">Open in SNKRS</a>
    </div>

    <script>
        let received = false;
        const status = document.getElementById('status');
        const detail = document.getElementById('detail');

        window.addEventListener('message', async (e) => {
            // Only accept data sent from a StockX page
            if (e.origin !== 'https://stockx.com' || received || !e.data || typeof e.data.text !== 'string') return;
            received = true;
            e.source.postMessage('snkrs-ok', e.origin);
            status.textContent = 'Saving…';

            try {
                const res = await fetch('/api/stockx/sync', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(e.data),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Sync failed');

                status.textContent = `Synced ${data.sku} · ${data.size || ''}`;
                const parts = [];
                if (data.highest_bid) parts.push(`Bid $${data.highest_bid}`);
                if (data.lowest_ask) parts.push(`Ask $${data.lowest_ask}`);
                parts.push(`${data.sales_found} sales found, ${data.sales_added} new`);
                if (!data.sales_found) parts.push('Open Market Data › Sales before syncing to include sales history');
                detail.textContent = parts.join(' · ');

                const link = document.getElementById('openLink');
                link.href = `/?sku=${encodeURIComponent(data.sku)}&size=${encodeURIComponent(data.size || '')}`;
                link.classList.remove('hidden');
            } catch (err) {
                status.textContent = 'Could not sync';
                detail.textContent = err.message;
                received = false;
            }
        });
    </script>
</body>
</html>
