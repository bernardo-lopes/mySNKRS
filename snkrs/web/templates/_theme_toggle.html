<button id="themeToggle" type="button" title="Switch light / dark"
        class="w-8 h-8 rounded-lg border border-ink-600 text-gray-300 hover:bg-ink-700 flex items-center justify-center">
    <svg class="theme-icon-sun w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="theme-icon-moon w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
</button>
<style>
    .theme-icon-moon { display: none; }
    :root.light .theme-icon-moon { display: block; }
    :root.light .theme-icon-sun { display: none; }
</style>
<script>
    document.getElementById('themeToggle').addEventListener('click', () => {
        const light = document.documentElement.classList.toggle('light');
        try { localStorage.setItem('snkrs-theme', light ? 'light' : 'dark'); } catch (e) {}
        document.dispatchEvent(new Event('themechange'));
    });
</script>
